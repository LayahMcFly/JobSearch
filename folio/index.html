<title>Folio: Resume and Hire-Me Site Builder</title>
<meta name="description" content="Build a resume, pick its style, fonts and colors, then publish a one-page site with a hire-me form.">

<!--
  Folio: build a resume, choose its style, fonts and colors, and publish a one-page site with a hire-me form
  (like Ko-fi or Carrd, on your own address). One self-contained file; your work is saved in this browser.
  It lives at /folio/ in the JobSearch repo as its own file. It never reads or changes Job Search.

  Sections: 1 data and sample | 2 style choices | 3 page builder (buildSite) | 3b data cleaning | 4 editor panels | 5 preview | 6 export, backup, confirm dialog | 7 theme

  Versions (Folio has its own notes, separate from Job Search and the hub):
  v1.0.1 Phase 0 fixes: demo-only preview, provider-aware success handling, safe serialization, email-mode validation, contrast, themed confirmations, touch targets, favicon.
  v1.0.0 first release: resume editor, 6 layouts, 6 font pairs, colors and paper tone, live preview, Save as PDF,
         one-page site export with services, a poll question and a hire-me form (Formspree, Web3Forms or email), backup and restore.
-->
<style>
:root{
  --bg:#f7f2ea;--surface:#fffdf9;--surface-2:#f0e8db;--text:#2a241f;--muted:#5c5248;--border:#d8ccbb;--input-border:#8f806c;--field:#fff;
  --accent:#8a3f1f;--accent-hover:#6f3116;--accent-glow:#a5532c;--accent-text:#8a3f1f;--accent-soft:#f4e3d7;--accent-line:#e0c3ae;--tint:#fbf7f1;
  --danger:#9b2c2c;--radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
button,summary,.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus:not(:focus-visible){outline:none}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;line-height:1.2}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:.7rem 1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.bar h1{font-size:1.5rem;margin-right:auto}
.btn{min-height:44px;padding:.45rem 1.05rem;border-radius:999px;border:1.5px solid var(--input-border);background:linear-gradient(180deg,var(--surface),var(--surface-2));color:var(--text);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;text-decoration:none}
@media (hover:hover){.btn:hover{background:linear-gradient(180deg,var(--tint),var(--accent-soft))}}
.btn-primary{background:linear-gradient(135deg,var(--accent-glow),var(--accent) 55%,var(--accent-hover));border-color:var(--accent-hover);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn-small{min-height:36px;padding:.2rem .8rem;font-size:.92rem}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.layout{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:1.2rem;padding:1rem;max-width:1400px;margin:0 auto}
.panel{min-width:0}
.preview-pane{position:sticky;top:76px;align-self:start;height:calc(100dvh - 92px);display:flex;flex-direction:column;gap:.6rem;min-width:0}
.view-tabs{display:flex;gap:.4rem}
.view-tabs .btn{flex:1}
.view-tabs .btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent-glow),var(--accent));color:#fff;border-color:var(--accent-hover)}
#frame{flex:1;width:100%;border:1.5px solid var(--border);border-radius:var(--radius);background:#fff;min-height:420px}
.seg{display:none;gap:.4rem;padding:.6rem 1rem 0}
.seg .btn{flex:1}
.seg .btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent-glow),var(--accent));color:#fff;border-color:var(--accent-hover)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:.8rem}
  .seg{display:flex}
  .preview-pane{position:static;height:75dvh}
  body[data-show="edit"] .preview-pane{display:none}
  body[data-show="preview"] .panel{display:none}
}
details.card{border:1.5px solid var(--border);border-radius:var(--radius);background:linear-gradient(180deg,var(--surface),var(--tint));margin-bottom:.8rem;overflow:hidden}
details.card>summary{list-style:none;cursor:pointer;padding:.85rem 1rem;font-family:Georgia,serif;font-weight:700;font-size:1.12rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(45deg);transition:transform .15s;margin-right:.3rem}
details.card[open]>summary::after{transform:rotate(-135deg)}
.card-body{padding:0 1rem 1rem;display:grid;gap:.8rem}
label.f{display:grid;gap:.25rem;font-weight:600;font-size:.92rem}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=url],input[type=tel],textarea,select{width:100%;font:inherit;font-weight:400;color:var(--text);padding:.6rem .75rem;border-radius:10px;border:1.5px solid var(--input-border);background:linear-gradient(var(--field),var(--field)) padding-box;caret-color:var(--accent);transition:box-shadow .15s,border-color .15s}
textarea{min-height:5.5rem;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
::placeholder{color:#6b6157;opacity:1}
.selwrap{position:relative}
.selwrap select{appearance:none;-webkit-appearance:none;padding-right:2.4rem;cursor:pointer}
.selwrap::after{content:"";position:absolute;right:1rem;top:50%;width:8px;height:8px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.entry{border:1.5px dashed var(--accent-line);border-radius:10px;padding:.8rem;display:grid;gap:.7rem;background:var(--surface)}
.entry-head{display:flex;justify-content:space-between;gap:.6rem;align-items:center;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.choice{position:relative;border:1.5px solid var(--border);border-radius:12px;padding:.7rem;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:.15rem}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);background:var(--accent-soft)}
.choice b{font-size:.98rem}.choice span{font-size:.82rem;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--border);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent-text)}
input[type=color]{width:52px;height:44px;padding:2px;border-radius:50%;border:1.5px solid var(--input-border);background:var(--surface);cursor:pointer}
.hint{color:var(--muted);font-size:.88rem;margin:0}
.steps{margin:0;padding-left:1.2rem;display:grid;gap:.45rem}
.btnrow{display:flex;flex-wrap:wrap;gap:.6rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#2a241f;color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:50;max-width:92vw;display:none}
.toast.show{display:block}
footer{text-align:center;color:var(--muted);font-size:.88rem;padding:1.5rem 1rem 2rem;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.notes-btn{min-height:36px;padding:.25rem .9rem;border-radius:999px;border:1.5px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--bg));color:var(--accent-text);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.notes-btn svg{width:18px;height:18px;margin-right:.45rem;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
dialog.notes-card{margin:auto;padding:0;border:1px solid var(--border);border-radius:16px;width:min(560px,94vw);max-height:min(80dvh,560px);background:var(--surface);color:var(--text);overflow:hidden}
dialog.notes-card[open]{display:flex;flex-direction:column}
dialog.notes-card::backdrop{background:rgba(42,36,31,.45)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;background:var(--bg);border-bottom:1px solid var(--border)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--bg));color:var(--text);font-size:1.5rem;cursor:pointer}
.notes-scroll{overflow:auto;padding:.25rem 1rem 1rem}
.notes-grid{display:grid;grid-template-columns:max-content 1fr;font-size:.95rem}
.notes-grid>*{padding:.65rem .5rem;border-bottom:1px solid var(--border)}
.notes-grid .nh{font-weight:700;border-bottom:2px solid var(--border)}.notes-grid .nv{font-weight:700;white-space:nowrap}

/* touch targets: every button, field and section header is at least 44px tall, with 8px between neighbours */
.btn,.btn-small{min-height:44px}
input[type=text],input[type=email],input[type=url],input[type=tel],select{min-height:44px}
details.card>summary{min-height:48px}
.notes-btn{min-height:44px;padding:.35rem 1rem}
.view-tabs,.seg,.btnrow{gap:.5rem}
.card-body .btn,.entry .btn{margin:0}
.fielderr{color:var(--danger);font-weight:600;font-size:.9rem}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 25%,transparent)}
.btn-danger-fill{background:var(--danger);border-color:var(--danger);color:#fff;text-shadow:none}
@media (hover:hover){.btn-danger-fill:hover{background:#7d2020}}
dialog.confirm-card{margin:auto;width:min(440px,92vw);padding:1.3rem;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);box-shadow:0 18px 50px rgba(40,25,10,.3)}
dialog.confirm-card::backdrop{background:rgba(42,36,31,.5)}
dialog.confirm-card h2{font-size:1.3rem;margin-bottom:.5rem}dialog.confirm-card p{margin:0 0 1.1rem;color:var(--muted)}
.cf-actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}

/* published-page viewer (?id=...) */
html.viewer body>*:not(#viewer):not(script){display:none!important}
#viewer{position:fixed;inset:0;background:#fff}#viewFrame{display:block;width:100%;height:100%;border:0;background:#fff}#viewFrame[hidden],#viewMsg[hidden]{display:none}
.view-msg{max-width:34rem;margin:22vh auto 0;padding:1.5rem;text-align:center;font:1.05rem/1.6 var(--font-body,system-ui,sans-serif);color:#2a241f}
/* publishing card */
.pubmsg{margin:.6rem 0;padding:.7rem .9rem;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-weight:600}.pubmsg.err{color:var(--danger);border-color:var(--danger)}.pubmsg.ok{color:#1b5e2e;border-color:#1b5e2e}
.keybox{margin:1rem 0;padding:.9rem;border:1px dashed var(--border);border-radius:12px;background:var(--surface-2)}.keybox p{margin:.4rem 0 .7rem}
.check{display:flex;gap:.8rem;align-items:flex-start;min-height:44px;padding:.5rem 0;cursor:pointer}.check input{flex:none;appearance:none;-webkit-appearance:none;display:grid;place-content:center;width:44px;height:44px;margin:0;border:1.5px solid var(--input-border);border-radius:12px;background:var(--surface);cursor:pointer}.check input::before{content:'';width:1.2rem;height:1.2rem;border-radius:5px;background:var(--accent);transform:scale(0);transition:transform .12s}.check input:checked::before{transform:scale(1)}.check input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.check span{align-self:center}
input[readonly]{background:var(--surface-2)}.tsbox{min-height:68px;margin:.6rem 0}
</style>
<script>if (new URLSearchParams(location.search).has('id')) document.documentElement.classList.add('viewer');</script>
</head>

</div>

    <div class="nh" role="columnheader">Version</div><div class="nh" role="columnheader">What is in it</div></div></div>
</dialog>

<script>

const APP_VERSION = 'v1.1.0';

  ['v1.1.0', 'Publish online: Publish, Copy link, View page, Update and Unpublish with a generated page ID. Viewing needs no account. A separate private edit key, kept out of links and backups, controls updates. Publishing recovery file for other devices.'],

];

/* ---------- 1. data and sample ---------- */

   api = the service's address with no trailing slash. siteKey = the Turnstile widget's SITE key. The Turnstile SECRET key

const PUBLISH = { api: 'https://folio-pages.princesslayah404.workers.dev', siteKey: '0x4AAAAAAGNs6F3KjNe5u_CH' };

const SAMPLE = {

const STYLE0 = { layout: 'modern', font: 'editorial', color: '#8a3f1f', paper: 'white' };

/* ---------- 2. style choices ---------- */
const LAYOUTS = [
  ['modern', 'Modern', 'Color sidebar with contact and skills'],

  warm: ['Warm serif', 'Fraunces', 'DM Sans', "Fraunces,Georgia,serif", "'DM Sans',system-ui,sans-serif"]
};
const COLORS = ['#8a3f1f', '#6b3fa0', '#1d5b86', '#2f6b4f', '#a4263f', '#2a241f', '#b06a00', '#0f766e'];
const PAPERS = { white: ['White', '#ffffff', '#1f1b16', '#5d554b', '#e4ddd2'], warm: ['Warm paper', '#fbf6ec', '#2a241f', '#5c5248', '#e3d8c6'], dark: ['Dark', '#16131a', '#f1ecf7', '#b7aec4', '#352f3f'] };

/* ---------- 3. page builder ---------- */
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const safeUrl = u => { u = String(u || '').trim(); if (!u) return ''; if (/^(https?:|mailto:|tel:)/i.test(u)) return u; if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)) return 'https://' + u; return ''; };

const lines = t => String(t || '').split(/\n+/).map(x => x.trim()).filter(Boolean);

/* Colors. The saved accent (ST.color) is never changed. Each paper gets a readable version of it:

/* ---------- 3b. clean data on the way in (saved data and restored backups) ---------- */
// Only known fields survive, each as text of a sane length, so a hand-edited or hostile backup cannot add
// fields, change types or smuggle objects into the page. Missing fields fall back to the sample, as before.
const FORM_MODES = ['email', 'formspree', 'web3forms'];
function normData(x) {
  x = x && typeof x === 'object' && !Array.isArray(x) ? x : {};
  const o = {};
  const strs = { name: 120, headline: 200, email: 254, phone: 60, location: 120, website: 300, summary: 2000, skills: 2000, availability: 200, ctaLabel: 60, formTitle: 200, pollQuestion: 200, pollOptions: 1500, formEndpoint: 300, thanks: 400 };
  for (const k in strs) o[k] = own(x, k) ? (typeof x[k] === 'string' ? x[k].slice(0, strs[k]) : '') : SAMPLE[k];
  o.formMode = own(x, 'formMode') && FORM_MODES.includes(x.formMode) ? x.formMode : SAMPLE.formMode;
  const lists = { experience: [{ role: 120, company: 120, dates: 60, bullets: 4000 }, 30], education: [{ school: 120, degree: 120, dates: 60 }, 20], links: [{ label: 80, url: 300 }, 20], services: [{ title: 100, desc: 600, price: 60 }, 20] };
  for (const k in lists) {
    const [shape, max] = lists[k];
    o[k] = !own(x, k) ? JSON.parse(JSON.stringify(SAMPLE[k])) : Array.isArray(x[k]) ? x[k].filter(e => e && typeof e === 'object' && !Array.isArray(e)).slice(0, max).map(e => { const r = {}; for (const f in shape) r[f] = e && typeof e === 'object' && own(e, f) && typeof e[f] === 'string' ? e[f].slice(0, shape[f]) : ''; return r; }) : [];
  }
  return o;
}
function normStyle(x) {
  x = x && typeof x === 'object' ? x : {};
  return { layout: LAYOUTS.some(l => l[0] === x.layout) ? x.layout : STYLE0.layout, font: own(FONTS, x.font) ? x.font : STYLE0.font,
    color: hexOk(x.color) ? x.color.toLowerCase() : STYLE0.color, paper: own(PAPERS, x.paper) ? x.paper : STYLE0.paper };
}
if (!VIEWER) try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && typeof saved === 'object' && saved.D) { D = normData(saved.D); ST = normStyle(saved.ST); } } catch (e) {}

/* ---------- 6. export and backup ---------- */
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
/* Checks that must pass before a site can be downloaded. Returns the first problem, or null. */
const RESERVED_MAIL = /@(example\.(com|org|net)|test|invalid|localhost)$/i;
function validateExport() {
  const mail = String(D.email || '').trim(), ep = String(D.formEndpoint || '').trim();
  if (D.formMode === 'email') {
    if (!mail) return { field: 'email', card: 'about', msg: 'Add your email address. In email mode every draft is addressed to it.', mode: 'Email mode needs your email address (step 1).' };
    if (!validEmail(mail)) return { field: 'email', card: 'about', msg: 'This does not look like an email address. Use the form name@yourdomain.com.', mode: 'Email mode needs a valid email address (step 1).' };
    if (RESERVED_MAIL.test(mail)) return { field: 'email', card: 'about', msg: `${mail} is a sample address, so drafts would go nowhere. Enter your real email address.`, mode: 'Email mode needs your real email address (step 1).' };
  } else if (D.formMode === 'formspree') {
    if (!/^https:\/\/formspree\.io\/f\/[A-Za-z0-9]+$/.test(ep)) return { field: 'formEndpoint', card: 'send', msg: 'Paste the full Formspree address, like https://formspree.io/f/abcdwxyz.' };
  } else if (D.formMode === 'web3forms') {
    if (!/^[A-Za-z0-9-]{20,}$/.test(ep)) return { field: 'formEndpoint', card: 'send', msg: 'Paste your Web3Forms access key (a long code of letters, numbers and dashes).' };
  }
  return null;
}
function clearFieldError(field) {
  document.querySelectorAll(`[data-err="${field}"]`).forEach(e => { e.hidden = true; e.textContent = ''; });
  document.querySelectorAll(`[data-f="${field}"]`).forEach(i => i.removeAttribute('aria-invalid'));
  if (field === 'email') document.querySelectorAll('[data-err="mode"]').forEach(e => { e.hidden = true; e.textContent = ''; });
}
function showFieldError(v) {
  openCards[v.card] = true; if (v.mode) openCards.send = true; renderPanel();
  const err = document.querySelector(`[data-err="${v.field}"]`), input = document.querySelector(`[data-f="${v.field}"]`);
  if (err) { err.textContent = v.msg; err.hidden = false; }
  if (v.mode) { const m = document.querySelector('[data-err="mode"]'); if (m) { m.textContent = v.mode; m.hidden = false; } }
  if (input) { input.setAttribute('aria-invalid', 'true'); input.focus(); }
  toast('The site was not downloaded. Fix the highlighted field first.');
}
$('#exportBtn').addEventListener('click', () => {
  const problem = validateExport(); if (problem) { showFieldError(problem); return; }
  download('index.html', buildSite(D, ST), 'text/html'); toast('Downloaded index.html. Steps to publish are in section 8.');

$('#pdfBtn').addEventListener('click', () => {

function restore(file) { if (!file) return; file.text().then(t => { const j = JSON.parse(t); if (!j || typeof j !== 'object' || !j.D || typeof j.D !== 'object') throw 0; D = normData(j.D); ST = normStyle(j.ST); renderPanel(); change(); toast('Backup restored.'); }).catch(() => toast('That file is not a Folio backup.')); }

/* ---------- 6b. themed confirmation (replaces the browser's own confirm box) ---------- */
// Opens as a modal (the page behind is inert and Tab stays inside), focuses Cancel first, closes on Escape or a click
// outside, and puts focus back on the control that opened it unless the caller moves focus after a confirmed action.
function confirmDialog(o) {
  return new Promise(resolve => {
    const d = $('#confirmDialog'), trigger = document.activeElement;
    $('#cfTitle').textContent = o.title; $('#cfMsg').textContent = o.message; $('#cfOk').textContent = o.ok || 'Confirm';
    const onBackdrop = e => { if (e.target === d) d.close('cancel'); };
    d.addEventListener('close', () => { d.removeEventListener('click', onBackdrop); const yes = d.returnValue === 'ok'; if (!yes && trigger && trigger.isConnected) trigger.focus(); resolve(yes); }, { once: true });
    d.addEventListener('click', onBackdrop);
    d.returnValue = ''; d.showModal(); $('#cfCancel').focus();
  });
}
$('#cfCancel').addEventListener('click', () => $('#confirmDialog').close('cancel'));
$('#cfOk').addEventListener('click', () => $('#confirmDialog').close('ok'));

/* ---------- 6c. publishing: Publish, Copy link, View page, Update, Unpublish ---------- */
// The page's public ID is in the share link and only lets people VIEW. A separate private edit key is returned once,
// when the page is first published. It is kept only in this browser (key 'folio:v1:pub') and in the recovery file the
// owner saves. It is never in a URL, never in the ordinary backup, never in the published data, and it is sent only in an
// Authorization header. The Turnstile secret never appears in this file: only the public site key does.
const PUBKEY = 'folio:v1:pub', ID_RE = /^[2-9A-HJ-NP-Za-km-z]{12}$/, KEY_RE = /^[A-Za-z0-9_-]{43}$/;
let tsFailed = false, PUB = null, pubMsg = null, pubBusy = false, pubConsent = false, tsToken = '', tsWidget = null, tsLoading = null;
try { const p = JSON.parse(localStorage.getItem(PUBKEY) || 'null'); if (p && ID_RE.test(p.id) && KEY_RE.test(p.key) && p.api === PUBLISH.api) PUB = { id: p.id, key: p.key, api: p.api, at: Number(p.at) || 0, snap: String(p.snap || ''), saved: !!p.saved }; } catch (e) {}
const savePub = () => { try { if (PUB) localStorage.setItem(PUBKEY, JSON.stringify(PUB)); else localStorage.removeItem(PUBKEY); } catch (e) {} };
const snapNow = () => JSON.stringify({ D: normData(D), ST: normStyle(ST) });
const pubLink = id => { const u = new URL(location.href); u.search = ''; u.hash = ''; u.searchParams.set('id', id); return u.toString(); };
const waitText = s => s >= 7200 ? 'about ' + Math.round(s / 3600) + ' hours' : s >= 120 ? 'about ' + Math.round(s / 60) + ' minutes' : 'a minute';

async function pubApi(method, path, o) {
  o = o || {}; const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
  try {
    const headers = {}; if (o.body !== undefined) headers['Content-Type'] = 'application/json'; if (o.key) headers.Authorization = 'Bearer ' + o.key;
    const r = await fetch(PUBLISH.api + path, { method, headers, body: o.body === undefined ? undefined : JSON.stringify(o.body), signal: ctl.signal, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
    const text = await r.text(); let j = null; try { j = JSON.parse(text); } catch (e) { j = null; }
    return { status: r.status, json: j && typeof j === 'object' && !Array.isArray(j) ? j : null };
  } catch (e) { return { status: 0, json: null }; } finally { clearTimeout(timer); }
}
/* One honest sentence per failure. Nothing here claims success, and each says what state things are in. */
function failText(res, what) {
  const j = res.json || {}, e = j.error, wait = j.retryAfterSeconds ? ' Try again in ' + waitText(j.retryAfterSeconds) + '.' : '';
  const state = { publish: 'No page was created.', update: 'Your published page was not changed.', unpublish: 'Your page is still published.', check: '', load: '' }[what];
  if (res.status === 0 || !e) return 'No clear answer came back from the publishing service. It may be offline, or Cloudflare may be limiting it because a free daily limit was reached. Folio cannot tell whether ' + ({ publish: 'a page was created', update: 'the change was saved', unpublish: 'the page was removed', check: 'the key is right', load: 'the page exists' }[what]) + '. Open your link to check, then try again later.';
  switch (e) {
    case 'rate_limited': return 'Too many attempts from this connection.' + wait + ' ' + state;
    case 'busy': return 'Publishing is at its daily limit for everyone today.' + wait + ' ' + state;
    case 'verification_failed': case 'verification_required': return 'The human check did not pass or has expired. Complete it again and retry. ' + state;
    case 'verification_unavailable': return 'The human check service could not be reached, so nothing was published. Try again later. ' + state;
    case 'publishing_paused': return 'Publishing is paused right now. ' + state;
    case 'daily_limit': return 'The publishing service reached a free daily limit on Cloudflare (' + (j.which === 'read' ? 'reads' : 'writes') + ').' + wait + ' ' + state;
    case 'storage_unavailable': return 'The publishing storage is unavailable right now. ' + state;
    case 'too_large': return 'Your page is too large to publish (limit 100 KB). ' + state;
    case 'invalid_data': return 'The service rejected the page contents' + (j.detail ? ' (' + String(j.detail).slice(0, 120) + ')' : '') + '. ' + state;
    case 'edit_key_required': case 'forbidden': return 'The edit key does not match this page, or the page no longer exists. ' + state;
    case 'origin_not_allowed': return 'The publishing service does not accept requests from this website address. ' + state;
    default: return 'The publishing service returned an error (' + res.status + '). ' + state;
  }
}
function setPubMsg(kind, text) { pubMsg = text ? { kind, text } : null; const el = $('#pubLive'); if (el) el.innerHTML = pubMsgHtml(); }
const pubMsgHtml = () => pubMsg ? `<p class="pubmsg ${pubMsg.kind}" role="${pubMsg.kind === 'err' ? 'alert' : 'status'}">${esc(pubMsg.text)}</p>` : '';
function updatePubStatus() { const el = $('#pubDirty'); if (el && PUB) el.textContent = PUB.snap === snapNow() ? 'The published page matches what is in Folio.' : 'You have changes that are not published yet. Press Update published page.'; }
function setPubBusy(b) { pubBusy = b; document.querySelectorAll('[data-pub]').forEach(x => { x.disabled = b; }); }
/* The Publish button is never greyed out for a missing step: pressing it says what is missing. This shows where the human check stands. */
function refreshPubButtons() { const el = $('#tsState'); if (!el) return; el.textContent = tsToken ? 'Human check complete.' : tsFailed ? 'The human check did not run. See the message below.' : 'Waiting for the human check to finish. It can take a few seconds.'; }

function onlineBody() {
  if (!PUBLISH.api) return `<p class="hint"><b>Publishing is not connected yet.</b> It needs a small service that the owner of this Folio site sets up once. Until then, use Download my site in the next step.</p>`;
  const live = `<div id="pubLive" aria-live="polite">${pubMsgHtml()}</div>`;
  if (PUB) {
    const link = pubLink(PUB.id);
    return `<p class="hint">Your page is live. Anyone with the link can view it. They cannot change it, and the link does not contain your edit key.</p>` +
      `<label class="f">Share link<input type="text" readonly id="pubLink" value="${esc(link)}"></label>` +
      `<div class="btnrow"><button type="button" class="btn btn-primary" data-pub="copy">Copy link</button><a class="btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer">View page</a></div>` +
      `<p class="hint" id="pubDirty"></p>` +
      `<div class="btnrow"><button type="button" class="btn btn-primary" data-pub="update">Update published page</button><button type="button" class="btn btn-danger" data-pub="unpublish">Unpublish</button></div>` + live +
      `<div class="keybox"><b>Publishing recovery file</b><p class="hint">This file holds your private edit key. Anyone who has it can change or remove your page, so store it like a password. Do not share it, email it, or upload it to a public place such as GitHub. Without it, you cannot update or unpublish this page after you clear this browser or switch devices. Your normal backup does not include it.${PUB.saved ? '' : ' <b>You have not saved it yet.</b>'}</p><div class="btnrow"><button type="button" class="btn" data-pub="saveKey">Save recovery file</button></div></div>` +
      `<div class="btnrow"><button type="button" class="btn" data-pub="loadCopy">Load the published version into Folio</button><button type="button" class="btn" data-pub="forget">Stop managing this page here</button></div>` +
      `<p class="hint">After an update or unpublish, Folio shows what the service confirmed. Folio does not cache pages. If a page you just changed still looks old, wait a little and reload it. Copies that other people saved, and anything search engines or web archives stored, cannot be removed by Folio.</p>`;
  }
  return `<p class="hint"><b>What happens:</b> Folio saves a copy of your resume page online and gives you a link like <b>…/folio/?id=Ab3dE5gH7jKm</b>. Anyone with the link can view the page, with no account. Only you can update or unpublish it, using a private edit key that Folio gives you once.</p>` +
    `<label class="check"><input type="checkbox" id="pubConsent"${pubConsent ? ' checked' : ''}><span>I understand that everything on my page, including the email address and phone number I entered, becomes public. The hiring form works as set in step 7.</span></label>` +
    (PUBLISH.siteKey ? `<div id="tsBox" class="tsbox" aria-label="Human check"></div><p class="hint" id="tsState" role="status"></p>` : `<p class="pubmsg err">Publishing is not fully set up: the human-check site key is missing.</p>`) +
    `<div class="btnrow"><button type="button" class="btn btn-primary" data-pub="publish">Publish</button></div>` + live +
    `<div class="keybox"><b>Already published from another device?</b><p class="hint">Choose the recovery file you saved. Folio checks the key with the service before it trusts it.</p><label class="btn" style="cursor:pointer">Restore publishing access<input type="file" id="pubRestoreFile" accept="application/json" hidden></label></div>`;
}
function loadTurnstile() {
  if (window.turnstile) return Promise.resolve();
  return tsLoading || (tsLoading = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; s.async = true; s.onload = () => res(); s.onerror = () => { tsLoading = null; rej(new Error('load')); }; document.head.appendChild(s); }));
}
async function mountTurnstile() {
  const box = $('#tsBox'); if (!box || PUB || !PUBLISH.siteKey || box.dataset.mounting) return; box.dataset.mounting = '1'; tsToken = ''; tsWidget = null; // loads Turnstile only once the Publish card is opened
  try {
    await loadTurnstile(); await new Promise(r => window.turnstile.ready(r)); const again = $('#tsBox'); if (!again || again !== box) return;
    tsWidget = window.turnstile.render(box, { sitekey: PUBLISH.siteKey, action: 'folio-publish', callback: t => { tsToken = t; tsFailed = false; refreshPubButtons(); setPubMsg('', ''); }, 'expired-callback': () => { tsToken = ''; refreshPubButtons(); }, 'error-callback': code => { tsToken = ''; tsFailed = true; refreshPubButtons(); setPubMsg('err', 'The human check could not run' + (code ? ' (code ' + String(code).slice(0, 12) + ')' : '') + '. Check your connection and reload Folio. If this keeps happening, the site key or its allowed website address in Turnstile may be wrong.'); } });
  } catch (e) { tsFailed = true; refreshPubButtons(); setPubMsg('err', 'The human check could not load, so publishing is unavailable right now. Check your connection (or an ad blocker that blocks challenges.cloudflare.com) and try again.'); }
}
function resetTurnstile() { tsToken = ''; try { if (tsWidget !== null && window.turnstile) window.turnstile.reset(tsWidget); } catch (e) {} refreshPubButtons(); }

async function doPublish() {
  if (pubBusy) return; const problem = validateExport(); if (problem) { showFieldError(problem); setPubMsg('err', 'Fix this first: ' + (problem.mode || problem.msg)); return; }
  if (!pubConsent) { setPubMsg('err', 'Tick the box above to confirm you understand your page becomes public, then press Publish again.'); return; }
  if (!tsToken) { setPubMsg('err', tsFailed ? 'The human check did not run, so nothing was published. See the message above.' : 'The human check has not finished yet. Wait for it to show as complete, then press Publish again.'); return; }
  setPubBusy(true); setPubMsg('note', 'Publishing…'); const snap = snapNow(), token = tsToken;
  const res = await pubApi('POST', '/api/pages', { body: { data: JSON.parse(snap), turnstile: token } }); tsToken = '';
  if (res.status === 201 && res.json && ID_RE.test(String(res.json.id)) && KEY_RE.test(String(res.json.editKey))) {
    PUB = { id: res.json.id, key: res.json.editKey, api: PUBLISH.api, at: Date.now(), snap, saved: false }; savePub(); pubConsent = false;
    setPubMsg('ok', 'Published. Copy your link, and save your recovery file now. It is the only way to update or unpublish from another device.'); setPubBusy(false); renderPanel(); const k = document.querySelector('[data-pub=saveKey]'); if (k) k.focus(); return;
  }
  setPubMsg('err', failText(res, 'publish')); setPubBusy(false); resetTurnstile();
}
async function doUpdate() {
  if (pubBusy || !PUB) return; const problem = validateExport(); if (problem) { showFieldError(problem); setPubMsg('err', 'Fix this first: ' + (problem.mode || problem.msg)); return; }
  setPubBusy(true); setPubMsg('note', 'Updating…'); const snap = snapNow();
  const res = await pubApi('PUT', '/api/pages/' + PUB.id, { key: PUB.key, body: { data: JSON.parse(snap) } });
  if (res.status === 200 && res.json && res.json.id === PUB.id) { PUB.snap = snap; savePub(); setPubMsg('ok', 'The service confirmed the update. Open your link to see what visitors get. If it still looks old, wait a little and reload.'); updatePubStatus(); }
  else setPubMsg('err', failText(res, 'update'));
  setPubBusy(false);
}
async function doUnpublish() {
  if (pubBusy || !PUB) return;
  const yes = await confirmDialog({ title: 'Unpublish this page?', message: 'Visitors who open the link will see "This page is not available". Copies other people saved cannot be removed. You can publish again later, but the new page gets a new link.', ok: 'Unpublish' }); if (!yes) return;
  setPubBusy(true); setPubMsg('note', 'Unpublishing…');
  const res = await pubApi('DELETE', '/api/pages/' + PUB.id, { key: PUB.key });
  if (res.status === 200 && res.json && res.json.deleted === true) { PUB = null; savePub(); setPubBusy(false); setPubMsg('ok', 'The service confirmed the page was removed. Its link now shows "This page is not available". Folio forgot the edit key.'); renderPanel(); const b = document.querySelector('[data-pub=publish]'); if (b && b.scrollIntoView) b.scrollIntoView({ block: 'nearest' }); return; }
  setPubMsg('err', failText(res, 'unpublish')); setPubBusy(false);
}
function saveRecovery() {
  if (!PUB) return;
  download('folio-publishing-recovery.json', JSON.stringify({ folioPublishing: 1, warning: 'Private. Anyone with this file can change or remove the page. Never share it or upload it anywhere public.', service: PUB.api, pageId: PUB.id, editKey: PUB.key, link: pubLink(PUB.id), savedAt: new Date().toISOString() }, null, 2), 'application/json');
  PUB.saved = true; savePub(); setPubMsg('ok', 'Recovery file downloaded. Keep it private, like a password.'); renderPanel();
}
async function restoreRecovery(file) {
  if (!file || pubBusy) return;
  if (file.size > 4000) { setPubMsg('err', 'That does not look like a Folio recovery file (it is too large).'); return; }
  let j; try { j = JSON.parse(await file.text()); } catch (e) { j = null; }
  if (!j || typeof j !== 'object' || j.folioPublishing !== 1 || !ID_RE.test(String(j.pageId)) || !KEY_RE.test(String(j.editKey))) { setPubMsg('err', 'That does not look like a Folio recovery file. Nothing was changed.'); return; }
  if (j.service !== PUBLISH.api) { setPubMsg('err', 'This recovery file is for a different publishing service. Nothing was changed.'); return; }
  setPubBusy(true); setPubMsg('note', 'Checking the key with the service…');
  const res = await pubApi('POST', '/api/pages/' + j.pageId + '/check', { key: j.editKey });
  if (res.status === 200 && res.json && res.json.ok === true) { PUB = { id: j.pageId, key: j.editKey, api: PUBLISH.api, at: Date.now(), snap: '', saved: true }; savePub(); setPubBusy(false); setPubMsg('ok', 'Publishing access restored on this device. Folio does not have your resume text yet if this is a new device. Use "Load the published version into Folio", then edit and update.'); renderPanel(); return; }
  setPubMsg('err', failText(res, 'check') || 'The key was not accepted.'); setPubBusy(false);
}
async function loadPublished() {
  if (pubBusy || !PUB) return;
  const yes = await confirmDialog({ title: 'Replace what is in Folio?', message: 'Folio will load the published version of your page into the editor. What is in Folio now will be replaced. Download a backup first if you want to keep it.', ok: 'Replace' }); if (!yes) return;
  setPubBusy(true); const res = await pubApi('GET', '/api/pages/' + PUB.id);
  if (res.status === 200 && res.json && res.json.data && res.json.data.D && res.json.data.ST) { D = normData(res.json.data.D); ST = normStyle(res.json.data.ST); PUB.snap = snapNow(); savePub(); save(); setPubBusy(false); setPubMsg('ok', 'Loaded the published version into Folio.'); renderPanel(); refresh(); return; }
  setPubMsg('err', failText(res, 'load')); setPubBusy(false);
}
function copyPubLink() {
  const el = $('#pubLink'); if (!el) return; const done = ok => setPubMsg(ok ? 'ok' : 'err', ok ? 'Link copied.' : 'Could not copy. Select the link and copy it yourself.');
  const fallback = () => { el.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} done(ok); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(() => done(true), fallback); else fallback();
}
document.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-pub]') : null; if (!b || b.disabled) return; const a = b.dataset.pub;
  if (a === 'publish') doPublish(); else if (a === 'update') doUpdate(); else if (a === 'unpublish') doUnpublish(); else if (a === 'copy') copyPubLink(); else if (a === 'saveKey') saveRecovery(); else if (a === 'loadCopy') loadPublished();
  else if (a === 'forget') confirmDialog({ title: 'Stop managing this page here?', message: 'The page stays public. This browser forgets its edit key, so unless you saved the recovery file you will not be able to update or unpublish it.', ok: 'Forget it' }).then(yes => { if (yes) { PUB = null; savePub(); setPubMsg('', ''); renderPanel(); } });
});
document.addEventListener('change', e => { if (e.target.id === 'pubConsent') { pubConsent = e.target.checked; refreshPubButtons(); if (pubConsent) setPubMsg('', ''); } if (e.target.id === 'pubRestoreFile') { restoreRecovery(e.target.files[0]); e.target.value = ''; } });

/* The page a visitor sees at ?id=… : no editor, no storage access. The published data is cleaned again here, then shown
   in a frame without same-origin access, so even a bug in the cleaning could not reach this site's saved data. */
async function startViewer() {
  const id = new URLSearchParams(location.search).get('id') || '', box = $('#viewer'), msg = $('#viewMsg'), fr = $('#viewFrame');
  const say = t => { msg.textContent = t; msg.hidden = false; fr.hidden = true; }; box.hidden = false; document.title = 'Page'; const gone = "This page is not available. The link may be wrong, or the page was unpublished.";
  if (!PUBLISH.api || !ID_RE.test(id)) return say(gone);
  say('Loading…'); const res = await pubApi('GET', '/api/pages/' + id);
  if (res.status === 404) return say(gone);
  if (res.status !== 200 || !res.json || !res.json.data || !res.json.data.D || !res.json.data.ST) return say(res.json && res.json.error === 'daily_limit' ? 'This page cannot be shown right now because the service reached a free daily limit. Please try again later.' : 'This page cannot be loaded right now. Please try again in a little while.');
  const d = normData(res.json.data.D), s = normStyle(res.json.data.ST); document.title = d.name || 'Page';
  fr.title = (d.name || 'Published') + ' resume page'; fr.srcdoc = buildSite(d, s, { viewer: true }); fr.hidden = false; msg.hidden = true;
}

/* ---------- 7. theme shared with the other tools, then start ---------- */
(function sharedTheme() {
  let st = {}; try { st = (JSON.parse(localStorage.getItem('jst:v1:settings')) || {}).app || {}; } catch (e) {}
  const setIcon = c => { const i = $('#favicon'); if (i) i.href = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="${c}"/><path d="M10 6h8l5 5v14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 9 25V7.5A1.5 1.5 0 0 1 10 6z" fill="#fff"/><path d="M18 6v5h5" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 16h8M12 20h8M12 24h5" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`); };
  if (st.theme === 'purple') { setIcon('#6b3fa0'); }
  if (st.theme === 'purple') { const P = { 'bg': '#f6f1fb', 'surface': '#fdfbff', 'surface-2': '#ece3f6', 'text': '#261d33', 'muted': '#594c6b', 'border': '#dacdea', 'accent': '#6b3fa0', 'accent-hover': '#552f82', 'accent-glow': '#8a5cc4', 'accent-text': '#6b3fa0', 'accent-soft': '#efe6fa', 'accent-line': '#d3bff0', 'tint': '#faf6fe', 'input-border': '#8a7aa0' }; for (const k in P) document.documentElement.style.setProperty('--' + k, P[k]); }
})();
$('#ver').textContent = 'Folio ' + APP_VERSION;
$('#notesBody').insertAdjacentHTML('beforeend', RELEASES.map(([v, t]) => `<div class="nv" role="cell">${esc(v)}</div><div role="cell">${esc(t)}</div>`).join(''));
$('#notesBtn').addEventListener('click', () => $('#notesDialog').showModal());
$('#notesClose').addEventListener('click', () => $('#notesDialog').close());
$('#notesDialog').addEventListener('click', e => { if (e.target === $('#notesDialog')) $('#notesDialog').close(); });
if (VIEWER) startViewer(); else { renderPanel(); refresh(); }
</script>
</body>
